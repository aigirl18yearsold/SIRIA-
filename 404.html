<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>404 | Page Not Found</title>

<style>

body {
  margin: 0;
  min-height: 100vh;

  display: flex;
  align-items: center;
  justify-content: center;

  font-family: Arial, sans-serif;

  background:
    radial-gradient(
      circle,
      rgba(20,121,255,0.2),
      transparent 40%
    ),
    #061426;

  color: white;

  text-align: center;
}

.content {
  padding: 30px;
}

h1 {
  font-size: clamp(7rem, 20vw, 14rem);
  margin: 0;

  background:
    linear-gradient(
      90deg,
      #ffffff,
      #5aafff
    );

  -webkit-background-clip: text;
  color: transparent;
}

p {
  color: #9db2cc;
  font-size: 1.1rem;
  margin-bottom: 30px;
}

a {

  display: inline-block;

  padding: 14px 25px;

  border-radius: 8px;

  background: #1479ff;

  color: white;

  text-decoration: none;

  font-weight: bold;
}

</style>
</head>

<body>

<div class="content">

<h1>404</h1>

<h2>Looks like you're lost.</h2>

<p>
The page you're looking for doesn't exist or may have moved.
</p>

<a href="index.html">
Back to Home
</a>

</div>

</body>
</html>
