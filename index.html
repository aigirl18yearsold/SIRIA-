  <style>

    /* =====================================================
       RESET
    ====================================================== */

    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 90px;
    }

    body {
      font-family:
        Inter,
        Arial,
        Helvetica,
        sans-serif;

      background: #061426;
      color: #f7faff;

      overflow-x: hidden;
      line-height: 1.6;

      transition:
        background 0.3s ease,
        color 0.3s ease;
    }

    body.light {
      background: #f5f9ff;
      color: #071426;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    ul {
      list-style: none;
    }

    button,
    input,
    textarea {
      font: inherit;
    }


    /* =====================================================
       VARIABLES
    ====================================================== */

    :root {

      --primary: #1479ff;
      --primary-dark: #0756d8;
      --primary-light: #5aafff;

      --dark: #061426;
      --dark-2: #0a1d36;
      --dark-3: #102846;

      --white: #ffffff;

      --text: #f5f9ff;
      --muted: #9db2cc;

      --card:
        rgba(15, 38, 68, 0.75);

      --border:
        rgba(255, 255, 255, 0.1);

      --shadow:
        0 25px 70px
        rgba(0, 0, 0, 0.3);
    }

    body.light {

      --dark: #f5f9ff;
      --dark-2: #ffffff;
      --dark-3: #eaf2ff;

      --text: #071426;
      --muted: #5c6f86;

      --card:
        rgba(255, 255, 255, 0.85);

      --border:
        rgba(0, 0, 0, 0.1);

      --shadow:
        0 25px 70px
        rgba(0, 50, 100, 0.12);
    }


    /* =====================================================
       REUSABLE
    ====================================================== */

    .container {
      width: min(1140px, 90%);
      margin: auto;
    }

    .section {
      padding: 110px 0;
    }

    .section-tag {

      display: inline-block;

      padding: 7px 13px;

      border-radius: 50px;

      background:
        rgba(20, 121, 255, 0.1);

      border:
        1px solid
        rgba(82, 165, 255, 0.2);

      color:
        var(--primary-light);

      font-size: 0.78rem;

      font-weight: 800;

      letter-spacing: 1.5px;

      text-transform: uppercase;

      margin-bottom: 18px;
    }

    .section-title {

      font-size:
        clamp(2.2rem, 5vw, 3.7rem);

      line-height: 1.1;

      letter-spacing: -1.5px;

      max-width: 760px;

      margin-bottom: 20px;
    }

    .section-text {

      color:
        var(--muted);

      font-size: 1.05rem;

      max-width: 650px;
    }

    .center {
      text-align: center;
    }

    .center .section-title,
    .center .section-text {
      margin-left: auto;
      margin-right: auto;
    }


    /* =====================================================
       BUTTONS
    ====================================================== */

    .btn {

      display:
        inline-flex;

      align-items: center;
      justify-content: center;

      gap: 8px;

      padding:
        14px 24px;

      border-radius:
        9px;

      font-weight:
        700;

      cursor:
        pointer;

      border:
        none;

      transition:
        0.3s ease;
    }

    .btn-primary {

      color:
        white;

      background:
        linear-gradient(
          135deg,
          #1479ff,
          #3b9fff
        );

      box-shadow:
        0 12px 35px
        rgba(20, 121, 255, 0.35);
    }

    .btn-primary:hover {

      transform:
        translateY(-3px);

      box-shadow:
        0 18px 45px
        rgba(20, 121, 255, 0.5);
    }

    .btn-secondary {

      color:
        var(--text);

      background:
        transparent;

      border:
        1px solid
        var(--border);
    }

    .btn-secondary:hover {

      background:
        rgba(20, 121, 255, 0.08);

      transform:
        translateY(-3px);
    }


    /* =====================================================
       LOADER
    ====================================================== */

    #loader {

      position:
        fixed;

      inset:
        0;

      background:
        #061426;

      z-index:
        99999;

      display:
        flex;

      align-items:
        center;

      justify-content:
        center;

      transition:
        opacity 0.6s ease,
        visibility 0.6s ease;
    }

    #loader.hide {

      opacity:
        0;

      visibility:
        hidden;
    }

    .loader-content {

      text-align:
        center;
    }

    .loader-logo {

      font-size:
        2.3rem;

      font-weight:
        900;

      letter-spacing:
        4px;

      margin-bottom:
        20px;
    }

    .loader-logo span {
      color: var(--primary);
    }

    .loader-bar {

      width:
        180px;

      height:
        4px;

      background:
        rgba(255,255,255,0.1);

      border-radius:
        20px;

      overflow:
        hidden;
    }

    .loader-progress {

      width:
        0;

      height:
        100%;

      background:
        var(--primary);

      animation:
        loading 1.5s ease forwards;
    }

    @keyframes loading {

      to {
        width: 100%;
      }

    }


    /* =====================================================
       HEADER
    ====================================================== */

    header {

      position:
        fixed;

      top:
        0;

      left:
        0;

      width:
        100%;

      z-index:
        1000;

      transition:
        0.3s ease;
    }

    header.scrolled {

      background:
        rgba(6, 20, 38, 0.88);

      backdrop-filter:
        blur(18px);

      border-bottom:
        1px solid
        var(--border);
    }

    body.light header.scrolled {

      background:
        rgba(255,255,255,0.9);
    }

    nav {

      height:
        78px;

      display:
        flex;

      align-items:
        center;

      justify-content:
        space-between;
    }

    .logo {

      font-size:
        1.65rem;

      font-weight:
        900;

      letter-spacing:
        2px;
    }

    .logo span {
      color:
        var(--primary);
    }

    .nav-links {

      display:
        flex;

      align-items:
        center;

      gap:
        28px;
    }

    .nav-links a {

      color:
        var(--muted);

      font-size:
        0.93rem;

      font-weight:
        600;

      transition:
        0.3s ease;
    }

    .nav-links a:hover {
      color:
        var(--text);
    }

    .nav-actions {

      display:
        flex;

      align-items:
        center;

      gap:
        12px;
    }

    .theme-btn {

      width:
        42px;

      height:
        42px;

      border-radius:
        50%;

      border:
        1px solid
        var(--border);

      background:
        transparent;

      color:
        var(--text);

      cursor:
        pointer;

      font-size:
        1rem;
    }

    .menu-btn {

      display:
        none;

      font-size:
        1.7rem;

      cursor:
        pointer;

      background:
        transparent;

      color:
        var(--text);

      border:
        none;
    }


    /* =====================================================
       HERO
    ====================================================== */

    .hero {

      min-height:
        100vh;

      display:
        flex;

      align-items:
        center;

      padding:
        120px 0 80px;

      position:
        relative;

      background:

        radial-gradient(
          circle at 15% 15%,
          rgba(20,121,255,0.18),
          transparent 30%
        ),

        radial-gradient(
          circle at 85% 30%,
          rgba(20,121,255,0.15),
          transparent 28%
        );
    }

    .hero::before {

      content:
        "";

      position:
        absolute;

      width:
        450px;

      height:
        450px;

      background:
        rgba(20,121,255,0.12);

      filter:
        blur(100px);

      border-radius:
        50%;

      top:
        10%;

      right:
        -150px;
    }

    .hero-grid {

      display:
        grid;

      grid-template-columns:
        1.05fr 0.95fr;

      gap:
        70px;

      align-items:
        center;
    }

    .hero-badge {

      display:
        inline-flex;

      align-items:
        center;

      gap:
        9px;

      padding:
        8px 15px;

      border-radius:
        50px;

      background:
        rgba(20,121,255,0.08);

      border:
        1px solid
        rgba(82,165,255,0.2);

      color:
        var(--primary-light);

      font-size:
        0.85rem;

      margin-bottom:
        25px;
    }

    .pulse-dot {

      width:
        8px;

      height:
        8px;

      background:
        #42f5a7;

      border-radius:
        50%;

      box-shadow:
        0 0 15px
        #42f5a7;

      animation:
        pulse 1.5s infinite;
    }

    @keyframes pulse {

      50% {
        transform:
          scale(1.6);

        opacity:
          0.5;
      }

    }

    .hero h1 {

      font-size:
        clamp(3.3rem, 7vw, 6.2rem);

      line-height:
        0.96;

      letter-spacing:
        -3px;

      margin-bottom:
        26px;
    }

    .gradient-text {

      background:
        linear-gradient(
          90deg,
          var(--text),
          var(--primary-light)
        );

      -webkit-background-clip:
        text;

      background-clip:
        text;

      color:
        transparent;
    }

    .hero p {

      color:
        var(--muted);

      font-size:
        1.08rem;

      max-width:
        570px;

      margin-bottom:
        35px;
    }

    .hero-buttons {

      display:
        flex;

      gap:
        14px;

      flex-wrap:
        wrap;
    }


    /* =====================================================
       HERO VISUAL
    ====================================================== */

    .hero-visual {

      position:
        relative;

      min-height:
        520px;

      display:
        flex;

      align-items:
        center;

      justify-content:
        center;
    }

    .hero-glow {

      position:
        absolute;

      width:
        380px;

      height:
        380px;

      border-radius:
        50%;

      background:
        rgba(20,121,255,0.2);

      filter:
        blur(80px);
    }

    .dashboard {

      width:
        min(100%, 470px);

      padding:
        25px;

      border-radius:
        25px;

      position:
        relative;

      background:

        linear-gradient(
          145deg,
          rgba(20,53,92,0.9),
          rgba(7,24,46,0.92)
        );

      border:
        1px solid
        rgba(255,255,255,0.12);

      box-shadow:
        var(--shadow);

      backdrop-filter:
        blur(15px);
    }

    body.light .dashboard {

      background:
        linear-gradient(
          145deg,
          #ffffff,
          #eaf3ff
        );
    }

    .dashboard-top {

      display:
        flex;

      align-items:
        center;

      justify-content:
        space-between;

      margin-bottom:
        25px;
    }

    .mini-brand {

      display:
        flex;

      align-items:
        center;

      gap:
        10px;
    }

    .mini-logo {

      width:
        45px;

      height:
        45px;

      display:
        grid;

      place-items:
        center;

      border-radius:
        13px;

      background:
        linear-gradient(
          135deg,
          #1479ff,
          #5aafff
        );

      font-weight:
        900;
    }

    .mini-brand small {

      color:
        var(--muted);
    }

    .status {

      padding:
        7px 12px;

      border-radius:
        50px;

      background:
        rgba(66,245,167,0.1);

      color:
        #42f5a7;

      font-size:
        0.78rem;
    }

    .chart-card {

      padding:
        23px;

      border-radius:
        18px;

      background:
        rgba(255,255,255,0.05);

      border:
        1px solid
        var(--border);
    }

    .chart-card small {

      color:
        var(--muted);
    }

    .chart-number {

      font-size:
        2.2rem;

      font-weight:
        900;

      margin:
        7px 0 20px;
    }

    .bars {

      height:
        140px;

      display:
        flex;

      align-items:
        flex-end;

      gap:
        10px;
    }

    .bar {

      flex:
        1;

      border-radius:
        6px 6px 0 0;

      background:
        linear-gradient(
          to top,
          #1479ff,
          #67b8ff
        );

      animation:
        bars 1.5s ease;
    }

    .bar:nth-child(1) {
      height: 42%;
    }

    .bar:nth-child(2) {
      height: 58%;
    }

    .bar:nth-child(3) {
      height: 46%;
    }

    .bar:nth-child(4) {
      height: 80%;
    }

    .bar:nth-child(5) {
      height: 67%;
    }

    .bar:nth-child(6) {
      height: 98%;
    }

    @keyframes bars {

      from {
        height:
          0;
      }

    }

    .floating-card {

      position:
        absolute;

      padding:
        15px 18px;

      border-radius:
        15px;

      background:
        rgba(9,29,54,0.9);

      border:
        1px solid
        var(--border);

      backdrop-filter:
        blur(15px);

      box-shadow:
        0 15px 40px
        rgba(0,0,0,0.25);
    }

    body.light .floating-card {
      background:
        rgba(255,255,255,0.9);
    }

    .floating-card small {

      color:
        var(--muted);
    }

    .floating-card strong {

      display:
        block;

      margin-top:
        4px;

      font-size:
        1.2rem;
    }

    .float-1 {

      top:
        35px;

      left:
        -20px;
    }

    .float-2 {

      bottom:
        40px;

      right:
        -20px;
    }


    /* =====================================================
       STATS
    ====================================================== */

    .stats {

      padding:
        45px 0;

      border-top:
        1px solid
        var(--border);

      border-bottom:
        1px solid
        var(--border);
    }

    .stats-grid {

      display:
        grid;

      grid-template-columns:
        repeat(4,1fr);

      gap:
        25px;
    }

    .stat-item {

      text-align:
        center;
    }

    .stat-number {

      display:
        block;

      font-size:
        2rem;

      font-weight:
        900;

      margin-bottom:
        5px;
    }

    .stat-label {

      color:
        var(--muted);

      font-size:
        0.85rem;
    }


    /* =====================================================
       SERVICES
    ====================================================== */

    .services-grid {

      display:
        grid;

      grid-template-columns:
        repeat(4,1fr);

      gap:
        20px;

      margin-top:
        55px;
    }

    .service-card {

      padding:
        30px;

      background:
        var(--card);

      border:
        1px solid
        var(--border);

      border-radius:
        20px;

      transition:
        0.35s ease;
    }

    .service-card:hover {

      transform:
        translateY(-9px);

      border-color:
        rgba(82,165,255,0.4);

      box-shadow:
        var(--shadow);
    }

    .service-icon {

      width:
        58px;

      height:
        58px;

      display:
        grid;

      place-items:
        center;

      font-size:
        1.4rem;

      border-radius:
        16px;

      margin-bottom:
        22px;

      background:
        rgba(20,121,255,0.12);

      color:
        var(--primary-light);
    }

    .service-card h3 {

      font-size:
        1.2rem;

      margin-bottom:
        12px;
    }

    .service-card p {

      color:
        var(--muted);

      font-size:
        0.92rem;
    }


    /* =====================================================
       ABOUT
    ====================================================== */

    .about-grid {

      display:
        grid;

      grid-template-columns:
        1fr 1fr;

      gap:
        80px;

      align-items:
        center;
    }

    .about-features {

      padding:
        38px;

      border-radius:
        24px;

      background:

        linear-gradient(
          145deg,
          rgba(20,121,255,0.15),
          var(--card)
        );

      border:
        1px solid
        var(--border);
    }

    .feature {

      display:
        flex;

      gap:
        16px;

      padding:
        20px 0;

      border-bottom:
        1px solid
        var(--border);
    }

    .feature:last-child {
      border-bottom:
        none;
    }

    .check {

      width:
        34px;

      min-width:
        34px;

      height:
        34px;

      display:
        grid;

      place-items:
        center;

      border-radius:
        50%;

      background:
        rgba(20,121,255,0.15);

      color:
        var(--primary-light);

      font-weight:
        900;
    }

    .feature h4 {

      margin-bottom:
        5px;
    }

    .feature p {

      color:
        var(--muted);

      font-size:
        0.9rem;
    }


    /* =====================================================
       PORTFOLIO
    ====================================================== */

    .portfolio-section {

      background:
        rgba(255,255,255,0.02);
    }

    .portfolio-filters {

      display:
        flex;

      justify-content:
        center;

      gap:
        10px;

      flex-wrap:
        wrap;

      margin:
        40px 0;
    }

    .filter-btn {

      padding:
        9px 16px;

      border-radius:
        50px;

      border:
        1px solid
        var(--border);

      background:
        transparent;

      color:
        var(--muted);

      cursor:
        pointer;
    }

    .filter-btn.active {

      background:
        var(--primary);

      color:
        white;

      border-color:
        var(--primary);
    }

    .portfolio-grid {

      display:
        grid;

      grid-template-columns:
        repeat(3,1fr);

      gap:
        22px;
    }

    .portfolio-card {

      overflow:
        hidden;

      border-radius:
        20px;

      border:
        1px solid
        var(--border);

      background:
        var(--card);

      transition:
        0.3s ease;
    }

    .portfolio-card:hover {

      transform:
        translateY(-7px);

      box-shadow:
        var(--shadow);
    }

    .portfolio-image {

      height:
        230px;

      display:
        flex;

      align-items:
        center;

      justify-content:
        center;

      font-size:
        4rem;

      background:

        linear-gradient(
          135deg,
          rgba(20,121,255,0.45),
          rgba(10,29,54,0.8)
        );
    }

    .portfolio-info {

      padding:
        23px;
    }
